<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HDeveloperH - Game Developer</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #1e1e1e; /* dark background */
      color: #f0f0f0; /* light text */
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
    }

    p {
      max-width: 500px;
      font-size: 1.1em;
      color: #ccc;
    }

    a.play-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #34a853; /* Google Play green */
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    a.play-link:hover {
      background-color: #2c8c46;
    }

    footer {
      text-align: center;
      padding: 10px;
      background-color: #111;
      font-size: 0.9em;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>Welcome to My Website!</h1>
    <p>
      Check out my latest games on Google Play and stay tuned for more updates!
    </p>
    <a class="play-link" href="https://play.google.com/store/apps/dev?id=4974151913987229797" target="_blank">
      Visit My Google Play Developer Page
    </a>
  </div>

  <footer>
    &copy; 2025 HDeveloperH - All Rights Reserved
  </footer>
</body>
</html>
