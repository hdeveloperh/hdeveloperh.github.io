<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #1e1e1e; /* dark background */
      color: #f0f0f0; /* light text */
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    footer {
      text-align: center;
      padding: 10px;
      background-color: #111; /* slightly darker footer */
      font-size: 0.9em;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>Hello, welcome to my personal website!</h1>
  </div>

  <footer>
    &copy; 2025 My Personal Website
  </footer>
</body>
</html>
